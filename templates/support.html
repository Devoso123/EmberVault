{% extends "base.html" %}
{% block title %}Support{% endblock %}
{% block content %}
<h2 style="color:var(--primary);">💬 Contact Support</h2>
<div class="card">
    <form id="supportForm">
        <div class="form-group"><label>Subject</label><input type="text" id="supportSubject" required></div>
        <div class="form-group"><label>Message</label><textarea id="supportMessage" rows="5" required></textarea></div>
        <button type="submit" class="btn">📧 Send</button>
    </form>
</div>
<div class="card">
    <h4>📞 Emergency Contacts</h4>
    <p><strong>Lord Damien Derrick</strong> – 0702634082 / sirdamienderrick@gmail.com</p>
    <p><strong>Alastor Damien Pinewoords</strong> – (blood brother)</p>
    <p><strong>Other Heads:</strong> Lincoln, Kevin, Luke, Tukuza</p>
</div>
<script>
    const token = '{{ token }}';
    document.getElementById('supportForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const subject = document.getElementById('supportSubject').value;
        const message = document.getElementById('supportMessage').value;
        const res = await fetch('/api/support/contact', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ subject, message })
        });
        const data = await res.json();
        alert(data.message || data.error);
        if (res.ok) { document.getElementById('supportForm').reset(); }
    });
</script>
{% endblock %}
