{% extends "base.html" %}
{% block title %}Confirm Reset{% endblock %}
{% block content %}
<div style="max-width:400px; margin:40px auto;">
    <h2 style="color:var(--primary);">🔑 Set New Password</h2>
    <form method="POST" action="/reset-password-confirm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="form-group password-toggle">
            <label>New Password</label>
            <input type="password" name="new_password" id="newPassword" required>
            <button type="button" class="toggle-btn" onclick="togglePassword('newPassword', this)">👁️</button>
        </div>
        <button type="submit" class="btn" style="width:100%;">Reset Password</button>
    </form>
    <div class="mt-10 text-center"><a href="/login">Back to Login</a></div>
</div>
<script>
function togglePassword(id, btn) {
    const input = document.getElementById(id);
    if (input.type === 'password') { input.type = 'text'; btn.textContent = '🙈'; }
    else { input.type = 'password'; btn.textContent = '👁️'; }
}
</script>
{% endblock %}
