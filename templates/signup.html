{% extends "base.html" %}
{% block title %}Sign Up{% endblock %}
{% block content %}
<div style="max-width:400px; margin:40px auto;">
    <h2 style="color:var(--primary); margin-bottom:20px;">📝 Sign Up</h2>
    <form method="POST" action="/signup">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group"><label>Full Name</label><input type="text" name="name" required></div>
        <div class="form-group"><label>Primary Phone</label><input type="text" name="primary_phone" required></div>
        <div class="form-group"><label>Secondary Phone (optional)</label><input type="text" name="secondary_phone"></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-group password-toggle">
            <label>Password</label>
            <input type="password" name="password" id="signupPassword" required>
            <button type="button" class="toggle-btn" onclick="togglePassword('signupPassword', this)">👁️</button>
        </div>
        <div class="form-group"><label>Role</label>
            <select name="role">
                <option value="member">Member</option>
                <option value="head">Head</option>
            </select>
        </div>
        <button type="submit" class="btn" style="width:100%;">Sign Up</button>
    </form>
    <div class="mt-10 text-center"><a href="/login">Already have an account? Login</a></div>
</div>
{% endblock %}
