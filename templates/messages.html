{% extends "base.html" %}
{% block title %}Messages{% endblock %}
{% block content %}
<div id="messages-page" data-current-user-id="{{ user.id }}">
    <h2 style="color:var(--primary);">💬 Messages</h2>
    <div class="flex gap-10">
        <div class="card" style="flex:1;">
            <h4>Conversations</h4>
            <div id="userList"></div>
        </div>
        <div class="card" style="flex:2;">
            <h4 id="conversationTitle">Select a user</h4>
            <div id="conversation" style="max-height:400px; overflow-y:auto; margin-bottom:10px;"></div>
            <form id="messageForm">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="form-group">
                    <textarea id="messageBody" rows="3" placeholder="Type your message..." required></textarea>
                </div>
                <button type="submit" class="btn">📤 Send</button>
            </form>
            {% if user.role == 'head' or user.is_superuser %}
            <hr>
            <button class="btn btn-gold" onclick="broadcastMessage()">📢 Broadcast to All</button>
            <input type="text" id="broadcastBody" placeholder="Broadcast message...">
            {% endif %}
        </div>
    </div>
</div>

<script>
    const token = '{{ token }}';
    const currentUserId = parseInt(document.getElementById('messages-page').dataset.currentUserId);
    let currentRecipient = null;

    async function loadUsers() {
        const res = await fetch('/api/group/members', { headers: { 'Authorization': 'Bearer ' + token } });
        const users = await res.json();
        document.getElementById('userList').innerHTML = users.map(u => `
            <div class="user-item" onclick="selectUser(${u.id}, '${u.name.replace(/'/g, "\\'")}')" style="cursor:pointer; padding:8px; border-bottom:1px solid var(--border);">
                <strong>${u.name}</strong> <small>(${u.role}${u.is_superuser ? ' ★' : ''})</small>
            </div>
        `).join('');
    }

    async function selectUser(userId, userName) {
        currentRecipient = userId;
        document.getElementById('conversationTitle').textContent = 'Chat with ' + userName;
        const res = await fetch(`/api/messages/conversation/${userId}`, { headers: { 'Authorization': 'Bearer ' + token } });
        const msgs = await res.json();
        document.getElementById('conversation').innerHTML = msgs.map(m => `
            <div style="text-align: ${m.sender_id === currentUserId ? 'right' : 'left'}; margin: 5px 0;">
                <strong>${m.sender_name}:</strong> ${m.body} <small class="text-muted">${m.created_at}</small>
            </div>
        `).join('') || '<p class="text-muted">No messages yet.</p>';
    }

    document.getElementById('messageForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!currentRecipient) { alert('Select a user first.'); return; }
        const body = document.getElementById('messageBody').value;
        const res = await fetch('/api/messages/send', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ recipient_id: currentRecipient, body })
        });
        const data = await res.json();
        if (res.ok) {
            document.getElementById('messageBody').value = '';
            selectUser(currentRecipient);
        } else {
            alert(data.error);
        }
    });

    async function broadcastMessage() {
        const body = document.getElementById('broadcastBody').value;
        if (!body) return alert('Enter a message');
        const res = await fetch('/api/messages/broadcast', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
            body: JSON.stringify({ body })
        });
        const data = await res.json();
        alert(data.message || data.error);
        if (res.ok) document.getElementById('broadcastBody').value = '';
    }

    loadUsers();
</script>
{% endblock %}
